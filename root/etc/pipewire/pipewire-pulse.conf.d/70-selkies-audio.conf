# pcmflux reads output.monitor and writes browser microphone audio to input.
pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=output sink_properties=device.description=Selkies_Speakers" }
    { cmd = "load-module" args = "module-null-sink sink_name=input channels=1 channel_map=mono sink_properties=device.description=Selkies_Mic_Injection" }
    { cmd = "load-module" args = "module-virtual-source source_name=SelkiesVirtualMic master=input.monitor channels=1 channel_map=mono" }
]
