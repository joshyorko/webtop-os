services:
  omarchy:
    environment:
      WEBTOP_HOST_AUTH: "true"
      WEBTOP_DOCKER_REGISTRY: ${WEBTOP_DOCKER_REGISTRY:-ghcr.io}
      START_DOCKER: "false"
    ports: !override
      - "127.0.0.1:${PORT_HTTP:-3000}:3000"
      - "127.0.0.1:${PORT_HTTPS:-3001}:3001"
    volumes:
      - type: bind
        source: ${WEBTOP_HOST_AUTH_DIR:?Set WEBTOP_HOST_AUTH_DIR to a dedicated host auth directory}
        target: /run/webtop-host-auth
        read_only: true
        bind:
          create_host_path: false
